# Release X.Y.Z to Maven Central, started by hand (Actions -> Release -> Run workflow, on main).
#
# 1. check: the inputs, the current version a snapshot, the tag vX.Y.Z new, and whether CI has passed on this commit;
# 2. verify: mvn verify, only if CI has not passed on this commit (no secrets);
# 3. publish (environment `release`: waits for the maintainer's approval, then gets the secrets): commit "Release X.Y.Z",
#    build and sign inds-parent, inds-core and inds-baselines, bundle them, upload the bundle to Central and wait until
#    Central has validated it; then tag vX.Y.Z, commit the next development version, push both commits and the tag to
#    main in one atomic push, and create a draft GitHub release.
# Publishing on Central stays manual: central.sonatype.com -> Publish -> Deployments -> Publish (or Drop); then publish
# the draft GitHub release. Steps, secrets and the manual fallback: CONTRIBUTING.md, "Releasing".
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version X.Y.Z
        required: true
      next:
        description: Next development version (default X.Y+1.0-SNAPSHOT)
        required: false
      dry-run:
        description: Dry run (no signing, no upload, no push, no GitHub release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  MVN: mvn --batch-mode --no-transfer-progress
  VERSION: ${{ inputs.version }}

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      next: ${{ steps.versions.outputs.next }}
      ci-passed: ${{ steps.ci.outputs.passed }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: pom.xml
          sparse-checkout-cone-mode: false
      - id: versions
        name: Check the versions and the tag
        env:
          NEXT: ${{ inputs.next }}
        run: |
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z: $VERSION"; exit 1; }
          next="${NEXT:-${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1)).0-SNAPSHOT}"
          [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]] || { echo "::error::next must be X.Y.Z-SNAPSHOT: $next"; exit 1; }
          current=$(python3 -c 'import xml.etree.ElementTree as T; print(T.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version"))')
          [[ "$current" == *-SNAPSHOT ]] || { echo "::error::current version $current is not a snapshot"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::tag v$VERSION exists"; exit 1
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Release $VERSION (current $current), then $next" >> "$GITHUB_STEP_SUMMARY"
      - id: ci
        name: Look for a passed CI run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)
          if (( passed > 0 )); then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "CI passed on $GITHUB_SHA: mvn verify is not repeated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No passed CI run on $GITHUB_SHA: running mvn verify" >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    needs: check
    if: needs.check.outputs.ci-passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify
        run: $MVN verify

  publish:
    needs: [check, verify]
    # verify is skipped when CI has already passed on this commit
    if: ${{ !cancelled() && needs.check.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.verify.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      NEXT: ${{ needs.check.outputs.next }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          gpg-private-key: ${{ !inputs.dry-run && secrets.GPG_PRIVATE_KEY || '' }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Check that main has not moved since the start
        run: |
          main=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ "$main" == "$GITHUB_SHA" ]] || { echo "::error::main moved to $main after the start ($GITHUB_SHA)"; exit 1; }
      - name: Commit the release version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $MVN versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          git commit -q -am "Release $VERSION"
      - name: Build, sign and bundle
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ "$DRY_RUN" == true ]]; then sign=(-Dgpg.skip); unsigned=(--unsigned); else sign=(); unsigned=(); fi
          $MVN -Prelease -Dmaven.test.skip=true "${sign[@]}" -pl .,inds-core,inds-baselines deploy
          python3 scripts/central-bundle.py target/central-staging target/central-bundle.zip "${unsigned[@]}"
      - name: Upload to Central and wait for the validation
        if: ${{ !inputs.dry-run }}
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: python3 scripts/central-upload.py target/central-bundle.zip "inds $VERSION"
      - name: Tag, set the next development version, push
        run: |
          git tag -a "v$VERSION" -m "Release $VERSION"
          $MVN versions:set -DnewVersion="$NEXT" -DgenerateBackupPoms=false
          git commit -q -am "Next development version $NEXT"
          git log --oneline -3
          if [[ "$DRY_RUN" == true ]]; then
            git push --dry-run --atomic origin HEAD:main "v$VERSION"
          else
            git push --atomic origin HEAD:main "v$VERSION"
          fi
      - name: Draft GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" target/central-bundle.zip --draft --verify-tag --title "$VERSION" --generate-notes
      - name: Summary
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            echo "Dry run: built and bundled $VERSION, nothing uploaded or pushed." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Uploaded $VERSION to Central (validated, not published); pushed v$VERSION and $NEXT to main."
              echo "1. Publish (or drop) the deployment on https://central.sonatype.com/publishing/deployments"
              echo "2. Publish the draft release on $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
