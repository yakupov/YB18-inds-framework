# Builds all modules and runs the tests of `mvn verify` (legacy, golden-master, oracle, short stress tests) on every
# push and pull request. The long stress runs (-Pstress) and the JMH benchmarks stay manual (CONTRIBUTING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify
        run: mvn --batch-mode --no-transfer-progress verify
